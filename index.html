<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestream Analytics Dashboard</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8w_WbSunn6nmiBuMmYsDDUsCffqmP7bwEd6gYkw5Y8Q&s=10" />

  <!-- Instant Browser Meta Redirect -->
  <meta http-equiv="refresh" content="0; url=https://livestreamanalytics.vercel.app/" />

  <!-- Canonical link -->
  <link rel="canonical" href="https://livestreamanalytics.vercel.app/" />

  <script>
    // Immediate JavaScript Top-Level Redirect
    window.location.replace("https://livestreamanalytics.vercel.app/");
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      width: 100%;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 10px;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting to Dashboard</h1>
    <p>Connecting to the live production server. If you are not redirected within a few seconds, click below.</p>
    <a class="btn" href="https://livestreamanalytics.vercel.app/">Launch Dashboard</a>
  </div>
</body>
</html>
